<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATRIX BOOT</title>
<!--
  dsh-desktop 启动片头 —— 黑客帝国档(数字雨), 约 13 秒(页面先就绪会自动收尾到 ~10 秒)。

  与 550c-boot.html 是两份独立资源: 那份由 scripts\make-splash.ps1 从上游原稿
  定点改写生成, 重跑脚本会被覆盖; 这份是本项目手写的原创页面, 不进生成流程。
  视觉全部用 canvas + CSS 现画(没有外部图片/视频/字体文件)。

  视觉参考《黑客帝国动画版·虚拟程序》(Program) 片头: 满屏左右镜像的密集代码雨、
  白色雨头、纯黑底上细衬线超宽字距的标题卡、硬切黑场。

  时间轴: 开机线 → 数字雨满屏 + 终端日志逐行敲出
          → 雨中高亮格逐格点亮, 1.8s 起、7s 成形为 DEEPSEEK 鲸鱼
          → 故障条 + 径向闪光 → ACCESS GRANTED 压满屏
          → 硬切黑场(雨消失, 鲸鱼留下当背景) → 片尾标题卡 DEEPSEEK HARNESS
          → 逐字飘散模糊消失 → 淡出交接。

  与宿主的契约(与 550c-boot.html 一致):
    网页 → 宿主  {t:"ready"} 文档就绪, 可以下播放指令
                {t:"done"}  已淡到片头底色, 宿主该收起遮罩
    宿主 → 网页  window.dsh550c.play("matrix") / skip() / note(text) / hurry()

  调试(用浏览器直接打开时可用): ?speed=2 倍速播放; ?speed=0.5 慢放。

  实现要点:
  - 时间轴按 performance.now() 的真实时间推进(until/waitOr), 窗口被遮挡、系统休眠
    唤醒后定时器被节流也不会把整段拉长, 到点直接进入下一阶段。
  - 数字雨分远近两层(远层小字暗、慢; 近层大字亮、快), 加上偶发的"整列爆亮"和
    15 秒 1.045 倍的镜头缓推, 避免平面 wallpaper 感。
  - 观感层不加整屏 mix-blend-mode(will be 合成器每帧多做一次全屏混合), 荧光用普通
    半透明径向渐变近似; 闪光也改成以文字为中心的径向亮斑, 不再整屏铺白。
  - prefers-reduced-motion: reduce 时关掉数字雨/闪光/飘散, 只保留文字与淡入淡出。
-->
<style>
  :root{
    --bg:#050403;                 /* 与 SplashHost.BootBackground 一致, 交接时不闪色 */
    --green:#00ff41;              /* 贴原版的纯绿, 少一点青 */
    --green-bright:#d8ffe4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    cursor:default;user-select:none;-webkit-user-select:none;
  }
  body{
    font-family:Consolas,"Cascadia Mono","MS Gothic","Courier New",monospace;
    color:var(--green);
  }

  /* ---------- 数字雨 + 镜头缓推 ---------- */
  #rainWrap{
    position:fixed;inset:0;z-index:1;opacity:0;transform-origin:50% 46%;
    transition:opacity 1s ease;
    animation:drift 15s ease-out forwards;
  }
  body.dsh-rain #rainWrap{opacity:1;}
  /* 镜头极缓推近, 配合三层视差形成"从后往前"的纵深 */
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
  #rain{
    display:block;width:100%;height:100%;
    transition:transform .07s linear,filter .07s linear;
  }
  #rain.jit{transform:translateX(4px) skewX(-1.1deg);filter:brightness(1.3);}

  /* 鲸鱼层: 和雨分开一块画布 —— 硬切黑场时雨要瞬间消失, 鲸鱼得留下来当文字背景 */
  #whale{
    position:fixed;inset:0;z-index:7;display:block;pointer-events:none;
    /* canvas 是替换元素, 光有 inset:0 不会拉伸 —— 必须显式给 100%,
       否则按物理像素尺寸(含 dpr)铺出去, 右下会被视口裁掉, 看起来整体偏右下 */
    width:100%;height:100%;
    transition:opacity .8s ease;
  }
  /* 切到片尾标题卡后压低一点, 免得盖过文字 */
  body.dsh-whale-dim #whale{opacity:.7;}

  /* 硬切黑场: 数字雨/日志/状态行瞬间收掉, 只留黑底上的标题卡 */
  body.dsh-cut #rainWrap,body.dsh-cut #glow,body.dsh-cut #scan,body.dsh-cut #vignette,
  body.dsh-cut #sweep,body.dsh-cut #stage,body.dsh-cut #status,body.dsh-cut #enter{
    opacity:0!important;transition:none!important;animation:none!important;
  }

  /* ---------- 屏幕质感层: 暗角 / 扫描线 / 荧光 / 扫掠光带 ---------- */
  #vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,
      rgba(5,4,3,0) 34%,rgba(5,4,3,.55) 76%,rgba(5,4,3,.94) 100%);
  }
  #scan{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.38;
    background:repeating-linear-gradient(to bottom,
      rgba(0,255,70,.045) 0 1px,rgba(0,0,0,0) 1px 3px);
  }
  /* 荧光: 用普通半透明径向渐变近似 screen 混合, 省掉整屏混合通道 */
  #glow{
    position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.5;
    background:radial-gradient(ellipse at 50% 44%,
      rgba(0,255,80,.09) 0%,rgba(0,255,80,.05) 38%,rgba(0,0,0,0) 68%);
  }
  #sweep{
    position:fixed;left:0;right:0;top:0;height:150px;z-index:5;pointer-events:none;opacity:0;
    background:linear-gradient(to bottom,
      rgba(0,255,102,0),rgba(0,255,70,.06),rgba(0,255,70,0));
    animation:sweep 7s linear 1.2s infinite;
  }
  @keyframes sweep{
    0%{transform:translateY(-160px);opacity:0}
    12%{opacity:.7}
    88%{opacity:.7}
    100%{transform:translateY(110vh);opacity:0}
  }

  /* ---------- 终端日志 ---------- */
  #stage{
    position:fixed;inset:0;z-index:10;display:flex;
    align-items:center;justify-content:center;pointer-events:none;
  }
  #log{
    width:min(720px,86vw);margin-top:4vh;text-align:left;
    font-size:clamp(12px,1.12vw,16px);line-height:2;color:#46ff85;
    /* 数字雨从字缝里穿过, 用一圈柔和的暗色光晕把日志压出来(不出现方块底色) */
    text-shadow:0 0 9px rgba(0,255,70,.5);
    box-shadow:0 0 80px 46px rgba(5,4,3,.66);
    opacity:0;transition:opacity .55s ease,transform .4s ease;
  }
  #log.show{opacity:1;}
  #log.out{opacity:0;transform:translateY(-12px);}
  #log .ln{white-space:pre;min-height:1em;}

  /* ---------- 标题(参考《虚拟程序》片头: 黑底 + 细衬线 + 超宽字距 + 微弱白光) ---------- */
  #titleBox{
    position:fixed;left:50%;top:50%;z-index:11;text-align:center;white-space:nowrap;
    transform:translate(-50%,-50%) translateY(12px);
    opacity:0;transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
  }
  #titleBox.show{opacity:1;transform:translate(-50%,-50%) translateY(0);}
  #titleBox .rule{display:none;}          /* 参考片头没有装饰线, 只留字 */
  #kicker{
    margin:0 0 26px;font-size:clamp(9px,.82vw,12px);letter-spacing:.62em;
    color:rgba(0,255,102,.42);text-transform:uppercase;
  }
  #title{
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    font-size:clamp(32px,5.4vw,84px);font-weight:400;letter-spacing:.28em;
    color:#e6f6e8;white-space:nowrap;
    text-shadow:0 0 3px rgba(210,255,220,.35),0 0 22px rgba(0,255,72,.3),
                0 0 60px rgba(0,255,72,.18);
    transition:opacity .3s ease;
  }
  /* 收尾: 逐字飘散 —— 每个字符一个 span, 各自带一份随机位移/旋转/模糊 */
  #title span{
    display:inline-block;white-space:pre;
    transition:transform 2.3s cubic-bezier(.22,.68,.16,1),
               opacity 2.1s ease,filter 2.3s ease;
  }
  #title.fly span{
    transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot)) scale(var(--sc,1));
    opacity:0;filter:blur(var(--bl,2px));
  }
  #title.glitch{animation:titleGlitch 2.6s steps(1) infinite;}
  @keyframes titleGlitch{
    0%,88%,100%{text-shadow:0 0 3px rgba(210,255,220,.35),0 0 22px rgba(0,255,72,.3),
                0 0 60px rgba(0,255,72,.18);transform:none;}
    90%{text-shadow:-5px 0 rgba(190,255,220,.55),5px 0 rgba(255,0,70,.3),0 0 18px rgba(0,255,102,.5);
        transform:translateX(2px);}
    93%{text-shadow:4px 0 rgba(0,255,102,.6),-4px 0 rgba(0,255,220,.4);transform:translateX(-2px);}
    96%{text-shadow:0 0 20px rgba(0,255,102,.55);transform:translateX(1px);}
  }
  /* 中文副标题: 学参考片头放在标题下方很远处, 小字号、低亮度、宽字距 */
  #sub{
    margin-top:12vh;font-size:clamp(11px,1.02vw,14px);letter-spacing:.58em;
    color:rgba(214,244,222,.62);opacity:0;transition:opacity 1.4s ease;
    font-family:Consolas,"Cascadia Mono","MS Gothic",monospace;
  }
  #sub.show{opacity:1;}
  /* 标题开始飘散时, 上下两行小字一起退场 */
  #titleBox.out #kicker,#titleBox.out #sub{opacity:0!important;transition:opacity .6s ease;}

  /* ---------- 底部状态行(宿主 note() 写的阶段文字落这里) ---------- */
  #status{
    position:fixed;left:0;right:0;bottom:26px;z-index:12;text-align:center;
    font-size:clamp(11px,1vw,13px);letter-spacing:.22em;
    color:rgba(0,255,102,.78);text-shadow:0 0 10px rgba(0,255,70,.42);
    opacity:0;transition:opacity .6s ease;pointer-events:none;
  }
  #status.show{opacity:1;}
  /* 宿主送来的是中文阶段提示, 原 letter-spacing 会把汉字撑得太散 */
  #status.zh{letter-spacing:.06em;font-size:clamp(11px,1vw,14px);}
  #status .cur{
    display:inline-block;width:.58em;height:1em;margin-left:.5em;vertical-align:-.12em;
    background:var(--green);box-shadow:0 0 12px rgba(0,255,102,.85);
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ---------- 高潮字幕: ACCESS GRANTED ----------
     标题卡在片尾, 高潮时 #titleBox 整块隐藏, 所以这条可以独占 body 层 */
  #enter{
    position:fixed;left:0;right:0;top:50%;z-index:22;text-align:center;
    transform:translateY(-50%) scale(1.12);white-space:nowrap;
    font-size:clamp(20px,3.4vw,46px);letter-spacing:.62em;
    color:#eaffef;opacity:0;
    text-shadow:0 0 18px rgba(0,255,72,.95),0 0 64px rgba(0,255,72,.62);
    pointer-events:none;
    transition:opacity .3s ease,letter-spacing 1s cubic-bezier(.2,.8,.2,1),
               transform 1s cubic-bezier(.2,.8,.2,1);
  }
  #enter.on{opacity:1;letter-spacing:.34em;transform:translateY(-50%) scale(1);}

  /* 闪光: 以文字为中心的径向亮斑, 而不是整屏铺白(整屏白会把画面压成灰雾) */
  #flash{
    position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 48%,
      rgba(226,255,236,.95) 0%,rgba(150,255,190,.42) 16%,rgba(0,255,120,.12) 34%,
      rgba(0,0,0,0) 60%);
    mix-blend-mode:screen;
  }
  #flash.on{animation:flashPulse .38s ease-out forwards;}
  @keyframes flashPulse{
    0%{opacity:0;transform:scale(.94)}
    18%{opacity:.9;transform:scale(1)}
    100%{opacity:0;transform:scale(1.06)}
  }

  /* 故障转场: 横向亮条(位置/高度由脚本随机, 用完即弃)
     注意类名不能叫 .glitch —— #title 也挂 .glitch 做闪烁, 会命中同一条规则 */
  .glitch-bar{
    position:fixed;left:0;right:0;z-index:15;height:2px;pointer-events:none;opacity:0;
    background:rgba(190,255,215,.45);
    box-shadow:0 0 14px rgba(0,255,70,.66);
  }
  .glitch-bar.on{animation:bar .5s steps(2) forwards;}
  @keyframes bar{
    0%{opacity:0;transform:translateX(0)}
    18%{opacity:.6;transform:translateX(-16px)}
    46%{opacity:.1;transform:translateX(11px)}
    74%{opacity:.4;transform:translateX(-5px)}
    100%{opacity:0;transform:translateX(0)}
  }

  /* ---------- 开机线(CRT 点亮) ---------- */
  #powerline{
    position:fixed;left:50%;top:50%;z-index:24;height:2px;width:0;transform:translate(-50%,-50%);
    background:#d8ffe4;box-shadow:0 0 16px rgba(0,255,102,.9),0 0 46px rgba(0,255,102,.55);
    pointer-events:none;opacity:0;
  }
  #powerline.on{animation:powerOn .95s cubic-bezier(.2,.9,.2,1) forwards;}
  @keyframes powerOn{
    0%{width:0;opacity:0}
    14%{width:7%;opacity:1}
    52%{width:100%;opacity:.92}
    68%{width:100%;opacity:.22}
    100%{width:100%;opacity:0}
  }

  /* ---------- 交接: 全体淡到片头底色 ---------- */
  body.dsh-fade #rainWrap,body.dsh-fade #whale,body.dsh-fade #sweep,body.dsh-fade #glow,
  body.dsh-fade #scan,body.dsh-fade #vignette,body.dsh-fade #stage,body.dsh-fade #titleBox,
  body.dsh-fade #status,body.dsh-fade #enter,body.dsh-fade #flash{
    opacity:0!important;transition:opacity .35s ease!important;animation:none!important;
  }

  /* ---------- 减少动效: 关掉雨/扫描/扫掠/镜头推近 ---------- */
  @media (prefers-reduced-motion: reduce){
    #rainWrap{animation:none;}
    #sweep{display:none;}
    #scan{opacity:.22;}
  }
</style>
</head>
<body>

<div id="rainWrap"><canvas id="rain"></canvas></div>
<canvas id="whale"></canvas>
<div id="sweep"></div>
<div id="glow"></div>
<div id="scan"></div>
<div id="vignette"></div>

<div id="stage"><div id="log"></div></div>

<div id="titleBox">
  <div class="rule"></div>
  <div id="kicker">WAKE UP // FOLLOW THE SIGNAL</div>
  <h1 id="title">DEEPSEEK HARNESS</h1>
  <div id="sub">// CONNECTED · 01001000 01001001</div>
  <div class="rule"></div>
</div>

<div id="status"><span id="statusText"></span><i class="cur"></i></div>
<div id="enter">ACCESS GRANTED</div>
<div id="flash"></div>
<div id="powerline"></div>

<script>
(() => {
"use strict";

const $ = s => document.querySelector(s);
const host = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
const post = msg => { try { if (host) host.postMessage(msg); } catch (e) {} };

/* ===== 调试开关(?speed=2 倍速 / ?speed=0.5 慢放) ===== */
const qs = new URLSearchParams(location.search);
const SPEED = Math.min(8, Math.max(0.25, parseFloat(qs.get("speed")) || 1));
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== 可取消计时: 跳过时一次性回收, 不留孤儿定时器 ===== */
let cancelled = false, launched = false, finished = false, hurryFlag = false;
const timeouts = new Set(), intervals = new Set();

/* 整段按"逻辑毫秒"编排, 真实等待 = 逻辑 / SPEED */
const T0 = performance.now();
const elapsed = () => (performance.now() - T0) * SPEED;

function sleep(logicalMs){
  return new Promise(resolve => {
    if (cancelled) return resolve();
    const id = setTimeout(() => { timeouts.delete(id); resolve(); },
                          Math.max(0, logicalMs / SPEED));
    timeouts.add(id);
  });
}
function later(fn, logicalMs){
  if (cancelled) return 0;
  const id = setTimeout(() => { timeouts.delete(id); if (!cancelled) fn(); },
                        Math.max(0, logicalMs / SPEED));
  timeouts.add(id);
  return id;
}
function every(fn, logicalMs){
  const id = setInterval(fn, Math.max(8, logicalMs / SPEED));
  intervals.add(id);
  return id;
}
function stopEvery(id){ clearInterval(id); intervals.delete(id); }

/* 等到某个逻辑时刻; 定时器被节流而迟到时立即返回, 不会把整段拖长 */
async function until(logicalMs){
  const wait = logicalMs - elapsed();
  if (wait > 0) await sleep(wait);
}
/* 最多等 logicalMs, 或者条件成立就提前结束(页面就绪后的"收尾"用) */
function waitOr(logicalMs, cond){
  return new Promise(resolve => {
    if (cancelled) return resolve();
    const deadline = elapsed() + logicalMs;
    const id = setInterval(() => {
      if (cancelled || cond() || elapsed() >= deadline){
        clearInterval(id);
        intervals.delete(id);
        resolve();
      }
    }, 50);
    intervals.add(id);
  });
}

/* ===== 数字雨(canvas, 远 / 中 / 近 三层) + 鲸鱼层 ===== */
const canvas = $("#rain");
const ctx = canvas.getContext("2d", { alpha: false });
const whaleCanvas = $("#whale");
const wctx = whaleCanvas.getContext("2d");
const BG = "#050403";
/* 半角片假名 + 数字 + 符号: 经典 Matrix 雨点字符集 */
const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=+-*<>|/\\";
const FONT = 'Consolas,"MS Gothic","Courier New",monospace';
const rndGlyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

/* ---- 鲸鱼掩码 ----
   由 assets/harness-logo.png 抠出的 128x94 剪影, 位打包后 base64 内嵌
   (运行时不加载任何图片, 保持单文件)。whaleAt(u,v) 判断归一化坐标是否在轮廓内。 */
const WHALE_PACK = "128|94|AAAAAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAYAAAeAAAAAAAAAAAAAAAH/wAAHwAAAAAAAAAAAAAAP/+AAD8AAAAAAAAAAAAAAf/+AAA/AAAAAAAAAAA//4f//AAAP4AAAAAAAAAD//////gAAD/AAAAAAAAAH//////wAAA/4AAAAGAAAP//////8AAAf/wAAADwAAH///////AAAH//AAAB8AAH///////wAAB//4AAA/AAH///////8AAAf//AAA/wAD////////gAAD//4Af/8AB////////8AAA///B///AA/////////gAAP//w///wAf////////+AAD//8///4AP/////////wAA//////+AH//////////AAH//////gD//////////4AB//////wA///////////AAf/////8Af//////////4AD/////+AP///////////AA//////gD///////////4AH/////wB////////////AA/////8Af///////////4AP////+AP////////////AB/////AD////////////4AP////gB/////////////AA////wAf////////////4AH///wAP/////////////AA///wAD/////////////4AP//wAA//////////////AD//AAAP/////////////4B//AAAH/gB///////////gf/wAAB/gAB//////////+H/8AAAf4AAB//////////7//AAAH+AAAH////////////gAAD/gAAAP/////A/////4AAA/4AAAA/////gD////+AAAP+AAAAD////4Af////gAAD/gAAAAf////AD////4AAA/4AAAAB/////Af///+AAAP+AAAAAP////4D////AAAD/wAAAAB////PAf///wAAA/8AAAAAH///jwD///8AAAP/AAAAAA///88A////AAAD/wAAAAAH///PAH///gAAA/8AAAAAA////wB///4AAAP/gAAAAAH///8AP//+AAAB/4AAAAAA////AD///AAAAf+AAAAAAH///wAf//wAAAH/wAAAAAA///+AH//8AAAB/8AAAAAAP///wB//+AAAAf/AAAAAAB///+A///gAAAD/4AAAAAAP///////wAAAA/+AAAAAAB///////8AAAAP/wAAAAAAf///////AAAAD/8AAAAAAD///////gAAAAf/gAAAAAAf//////4AAAAH/4AAAAAAD//////8AAAAB//AAAAAAA///////AAAAAP/wAAAAAAH//////gAAAAD/+AAAAAAA//////wAAAAAf/gAAAAAAP/////8AAAAAH/8AAAAAAB/////+AAAAAA//gAAAAAAP/////gAAAAAP/8AAAAAAD/////wAAAAAB//gAAAAAAf////4AAAAAAf/4AAA8AAD////8AAAAAAD//AAAPwAA/////AAAAAAA//4AAD/AAH////gAAAAAAH//AAA/4AA////wAAAAAAA//4AAP/gAH///4AAAAAAAH//gAB/8AA///+AAAAAAAB//8AAf/wAH///AAAAAAAAP//gAD/+AA///wAAAAAAAB//+AA//wAH///gAAAAAAAP//wAP//AA///+AAAAAAAB///AD//4AH///8AAAAAAAP//+D///AA////wAAAAAAB///////8AH///+AAAAAAAP///////wAf///wAAAAAAB////////wD///8AAAAAAAH////////////+AAAAAAAA/////////4///AAAAAAAAD////////4AP4AAAAAAAAAf///////8AAAAAAAAAAAAB///////+AAAAAAAAAAAAAH//////+AAAAAAAAAAAAAAf/////+AAAAAAAAAAAAAAB/////+AAAAAAAAAAAAAAAD////8AAAAAAAAAAAAAAAAD///wAAAAAAAAAAA==";

const WHALE = (() => {
  const p = WHALE_PACK.split("|");
  const raw = atob(p[2]);
  const bits = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bits[i] = raw.charCodeAt(i);
  return { w: parseInt(p[0], 10), h: parseInt(p[1], 10), bits };
})();

function whaleAt(u, v){
  const mx = Math.min(WHALE.w - 1, Math.max(0, (u * WHALE.w) | 0));
  const my = Math.min(WHALE.h - 1, Math.max(0, (v * WHALE.h) | 0));
  const bit = my * WHALE.w + mx;
  return (WHALE.bits[bit >> 3] & (128 >> (bit & 7))) !== 0;
}

/* 三层的"距离感": 字号 / 亮度 / 下落速度 / 拖尾长度逐层递减。
   远层最慢最暗最小、还错开半格落在近层柱缝里 —— 近层唰唰往下走, 远层只是缓缓漂,
   两者叠在一起才有"从后往前"的纵深。
   速度单位是"格/帧", 60fps 下近层 ≈ 8~17 格/秒(原来 ~66 格/秒, 就是那个"太快")。 */
const LAYER_DEFS = [
  { scale: 0.46, alpha: 0.15, vMin: 0.024, vMax: 0.050, offset: 0.55, tails: 0, step: 2 },
  { scale: 0.72, alpha: 0.28, vMin: 0.050, vMax: 0.100, offset: 0.28, tails: 1, step: 1 },
  { scale: 1.00, alpha: 1.00, vMin: 0.100, vMax: 0.220, offset: 0.00, tails: 2, step: 1 }
];

/* 鲸鱼在 1.8s 开始逐格点亮, 7.0s 成形(之后一直作为背景留在标题后面) */
const WHALE_REVEAL_FROM = 1800, WHALE_REVEAL_TO = 7000;
const WHALE_ASPECT = 890 / 654;     /* harness-logo 里鲸鱼剪影的宽高比 */

let W = 0, H = 0, dpr = 1, baseFont = 16;
let layers = [];
let whaleCells = [], whaleCell = 12;
let raining = false, raf = 0, lastFrame = 0, nextBurstAt = 0;

/* 把轮廓按当前的字体尺寸铺成格子: 每格一个字, 后期只按进度点亮 */
function buildWhale(){
  whaleCell = Math.max(7, Math.round(baseFont * 0.36));
  const bh = Math.min(H * 0.50, (W * 0.66) / WHALE_ASPECT);
  const bw = bh * WHALE_ASPECT;
  const bx = (W - bw) / 2;
  const by = H * 0.46 - bh / 2;

  const cols = Math.max(1, Math.floor(bw / whaleCell));
  const rows = Math.max(1, Math.floor(bh / whaleCell));
  whaleCells = [];
  for (let cy = 0; cy < rows; cy++){
    for (let cx = 0; cx < cols; cx++){
      const u = (cx + 0.5) / cols;
      const v = (cy + 0.5) / rows;
      if (!whaleAt(u, v)) continue;
      whaleCells.push({
        x: bx + cx * whaleCell + whaleCell * 0.5,
        y: by + cy * whaleCell + whaleCell * 0.5,
        ch: rndGlyph(),
        th: Math.pow(Math.random(), 1.7),   /* 点亮阈值: 偏小, 到中后段就基本铺满 */
        tone: Math.random(),        /* 亮度档: 少量近白当"高亮" */
        next: 0
      });
    }
  }
}

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.floor(window.innerWidth * dpr));
  H = Math.max(1, Math.floor(window.innerHeight * dpr));
  canvas.width = W;
  canvas.height = H;
  whaleCanvas.width = W;
  whaleCanvas.height = H;

  /* 字号比之前大一号(约 +20%), 更接近原版那种粗壮、能连成柱的量感 */
  baseFont = Math.max(12, Math.round(Math.min(24, window.innerWidth / 54))) * dpr;

  layers = LAYER_DEFS.map(def => {
    const font = Math.max(8, Math.round(baseFont * def.scale));
    const pitch = Math.max(7, Math.round(font * 1.12));
    const n = Math.ceil(W / pitch) + 1;
    const rows = H / pitch;
    return Object.assign({}, def, {
      font, pitch, n,
      drop: Array.from({ length: n }, () => Math.random() * rows * 1.25 - rows * 0.25),
      spd: Array.from({ length: n }, () => def.vMin + Math.random() * (def.vMax - def.vMin)),
      row: new Array(n).fill(-1e9),
      ch: new Array(n).fill("0"),
      burst: new Array(n).fill(-1e9)
    });
  });

  buildWhale();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
}

function drawRain(now, dt){
  /* 半透明底色反复覆盖 = 拖尾。拖尾长度 ≈ 下落速度 / 衰减率, 速度降到 ~1/4 后
     衰减也要跟着降(0.03), 否则每个字还没走出两格就被擦掉, 只剩一地散点 */
  ctx.fillStyle = "rgba(5,4,3,0.035)";
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "top";

  const near = layers[layers.length - 1];

  /* 偶发的"整列爆亮": 每 1.2~2.4 秒随机点亮 1~2 列近层, 亮 420ms */
  if (now > nextBurstAt){
    nextBurstAt = now + 1200 + Math.random() * 1200;
    near.burst[(Math.random() * near.n) | 0] = now;
    if (Math.random() < 0.3) near.burst[(Math.random() * near.n) | 0] = now;
  }

  for (let li = 0; li < layers.length; li++){
    const L = layers[li];
    const isNear = li === layers.length - 1;
    /* 近层稍微再快一点, 远层几乎不动 —— 视差就来自这里 */
    const ramp = isNear ? 1.12 : 0.92;

    ctx.font = L.font + "px " + FONT;
    const headAlpha = isNear ? 0.96 : Math.min(0.8, L.alpha + 0.12);

    for (let i = 0; i < L.n; i++){
      /* 远层隔列取样: 更稀、更像远处的余光, 也省一半绘制 */
      if (L.step > 1 && (i % L.step)) continue;
      const ax = i * L.pitch + L.pitch * L.offset + L.font * 0.94;
      const row = Math.floor(L.drop[i]);
      const y = row * L.pitch;
      const hot = isNear && (now - L.burst[i] < 420);

      if (hot){
        /* 爆亮列: 雨头往上 6 个字全部提到近白, 越往上越淡 */
        for (let k = 0; k < 6; k++){
          ctx.setTransform(-1, 0, 0, 1, ax, y - k * L.pitch);
          ctx.fillStyle = k === 0 ? "rgba(255,255,255,.96)"
                                  : "rgba(220,255,232," + (0.5 - k * 0.07).toFixed(2) + ")";
          ctx.fillText(rndGlyph(), 0, 0);
        }
      } else {
        /* 只有跨到新的一格才换字: 头字固定后每帧重绘以保持明亮,
           身后的拖尾交给底色衰减 —— 这样慢速下落也不会闪成一片噪点 */
        if (row !== L.row[i]){
          L.row[i] = row;
          L.ch[i] = rndGlyph();
          for (let k = 1; k <= L.tails; k++){
            ctx.setTransform(-1, 0, 0, 1, ax, y - k * L.pitch);
            ctx.fillStyle = "rgba(0,255,72," + (L.alpha * (0.62 - k * 0.18)).toFixed(2) + ")";
            ctx.fillText(rndGlyph(), 0, 0);
          }
        }
        ctx.setTransform(-1, 0, 0, 1, ax, y);
        ctx.fillStyle = "rgba(216,255,226," + headAlpha.toFixed(2) + ")";
        ctx.fillText(L.ch[i], 0, 0);
      }

      L.drop[i] += L.spd[i] * ramp * dt;
      if (y > H + L.pitch * 2 && Math.random() < 0.05){
        L.drop[i] = -Math.random() * 12;
        L.row[i] = -1e9;
      }
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* 鲸鱼: 只画"已点亮"的格子, 进度由 elapsed() 决定; 每帧清空后重绘, 因此能独立于雨存在 */
function drawWhale(now, force){
  if (!whaleCells.length) return;
  wctx.clearRect(0, 0, W, H);

  const p = force ? 1 : Math.max(0, Math.min(1,
    (elapsed() - WHALE_REVEAL_FROM) / (WHALE_REVEAL_TO - WHALE_REVEAL_FROM)));

  wctx.font = whaleCell + "px " + FONT;
  wctx.textBaseline = "top";

  for (let i = 0; i < whaleCells.length; i++){
    const c = whaleCells[i];
    const a = Math.min(1, (p - c.th) * 6);     /* 每格到自己的阈值就亮, 带一点淡入 */
    if (a <= 0.02) continue;

    if (now > c.next){ c.ch = rndGlyph(); c.next = now + 900 + Math.random() * 2800; }

    /* 轻微呼吸/抖动, 免得整片鲸鱼是一张静止的图 */
    const breathe = 0.86 + 0.14 * Math.sin(now * 0.0016 + i * 1.7);
    const alpha = (a * breathe * (c.tone < 0.15 ? 1 : c.tone < 0.45 ? 0.85 : 0.62)).toFixed(2);
    wctx.setTransform(-1, 0, 0, 1, c.x + whaleCell * 0.47, c.y);
    wctx.fillStyle = c.tone < 0.15 ? "rgba(244,255,248," + alpha + ")"
                    : c.tone < 0.45 ? "rgba(170,255,200," + alpha + ")"
                    : "rgba(0,255,72," + alpha + ")";
    wctx.fillText(c.ch, 0, 0);
  }
  wctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* 唯一的主循环: 雨停了也继续跑, 因为鲸鱼要留在标题后面继续闪 */
function tick(now){
  if (finished) return;
  raf = requestAnimationFrame(tick);

  const dt = Math.max(0.4, Math.min(2.6, (now - lastFrame) / 16.667 || 1));
  lastFrame = now;

  if (raining) drawRain(now, dt);
  if (!REDUCED) drawWhale(now);
}

function startRain(){
  if (raining) return;
  if (!layers.length) resize();
  lastFrame = performance.now();
  nextBurstAt = lastFrame + 900;
  raining = true;
  raf = requestAnimationFrame(tick);
}

/* 硬切黑场: 雨瞬间清掉, 但主循环继续(鲸鱼还要留在标题后面) */
function stopRain(){
  raining = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
}

/* ===== 文本效果 ===== */
let phaseText = "INITIALIZING NEURAL LINK";
let hostNote = "";

function renderStatus(){
  const el = $("#statusText");
  if (!el) return;
  el.textContent = hostNote || phaseText;
  $("#status").classList.toggle("zh", hostNote.length > 0);
}
function setPhase(text){ phaseText = text; renderStatus(); }

/* 标题乱码收敛: 从左到右逐字"锁死" */
function scramble(el, target, duration){
  const start = performance.now();
  const id = every(() => {
    const p = Math.min(1, (performance.now() - start) / (duration / SPEED));
    const lock = Math.floor(p * target.length);
    let out = "";
    for (let i = 0; i < target.length; i++){
      const c = target[i];
      out += (i < lock || c === " ") ? c : "01ABCDEF#%&*+<>/\\|"[(Math.random() * 16) | 0];
    }
    el.textContent = out;
    if (p >= 1){ el.textContent = target; stopEvery(id); }
  }, 34);
}

/* 标题逐字飘散: 拆成字符 span, 每字随机方向/旋转/缩放/模糊, 按顺序错开开始时间,
   于是从一头到另一头依次飞走、越飞越虚 */
function scatterTitle(el, box){
  if (!el) return;
  el.classList.remove("glitch");
  if (box) box.classList.add("out");

  /* 减少动效: 不拆分、不飞, 直接淡掉 */
  if (REDUCED){
    el.style.transition = "opacity .8s ease";
    el.style.opacity = "0";
    return;
  }

  const text = el.textContent;
  el.textContent = "";
  const frag = document.createDocumentFragment();
  for (const ch of text){
    const s = document.createElement("span");
    s.textContent = ch === " " ? "\u00a0" : ch;
    frag.appendChild(s);
  }
  el.appendChild(frag);

  const spans = el.querySelectorAll("span");
  spans.forEach((s, i) => {
    const dir = Math.random() < 0.5 ? -1 : 1;
    s.style.setProperty("--dx", (dir * (7 + Math.random() * 34)).toFixed(1) + "vw");
    s.style.setProperty("--dy", (-5 - Math.random() * 30).toFixed(1) + "vh");
    s.style.setProperty("--rot", (dir * (14 + Math.random() * 60)).toFixed(0) + "deg");
    s.style.setProperty("--sc", (0.6 + Math.random() * 0.9).toFixed(2));
    s.style.setProperty("--bl", (1 + Math.random() * 4).toFixed(1) + "px");
    s.style.transitionDelay = Math.round((i * 42 + Math.random() * 90) / SPEED) + "ms";
  });

  /* 先强制一次样式/布局, 让每个 span 的初始状态真正上屏;
     否则同一帧里再加 .fly 会因为没有"起始值"而直接瞬移(看不见飞的过程) */
  void el.offsetWidth;
  later(() => el.classList.add("fly"), 40);
}

/* 逐行敲字 */
function typeLine(el, text, cps){
  return new Promise(resolve => {
    if (cancelled) return resolve();
    let i = 0;
    el.textContent = "";
    const id = setInterval(() => {
      if (cancelled){ clearInterval(id); intervals.delete(id); return resolve(); }
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length){ clearInterval(id); intervals.delete(id); resolve(); }
    }, Math.max(8, Math.round(1000 / (cps * SPEED))));
    intervals.add(id);
  });
}

/* 故障转场: 随机横向亮条 + 画布瞬间错位 */
function glitchBurst(count){
  if (REDUCED) return;
  const n = count || 6;
  for (let i = 0; i < n; i++){
    const bar = document.createElement("div");
    bar.className = "glitch-bar";
    bar.style.top = (6 + Math.random() * 86).toFixed(2) + "%";
    bar.style.height = (1 + Math.random() * 4).toFixed(1) + "px";
    bar.style.animationDelay = Math.round(i * 46 / SPEED) + "ms";
    document.body.appendChild(bar);
    requestAnimationFrame(() => bar.classList.add("on"));
    later(() => bar.remove(), 720 + i * 60);
  }
  canvas.classList.add("jit");
  later(() => canvas.classList.remove("jit"), 140);
}

/* ===== 时间轴(逻辑毫秒) ===== */
const T = {
  logAt: 550,          /* 日志开始敲 */
  afterLog: 360,       /* 日志敲完 → 高潮 */
  grantHold: 2600,     /* ACCESS GRANTED 停留 */
  grantHoldFast: 1000, /* 页面早就绪时缩短 */
  cutBlack: 260,       /* 黑场垫一拍, 像剪辑 */
  scramble: 1000,      /* 标题乱码收敛 */
  cardHold: 2200,      /* 标题卡停留 */
  cardHoldFast: 1200,
  scatter: 2250,       /* 飘散到基本散尽 */
  scatterFast: 1350
};

async function playMatrix(){
  if (launched || finished) return;
  launched = true;

  if (REDUCED){
    /* 减少动效: 不跑雨, 鲸鱼直接以成形状态静态呈现 */
    resize();
    drawWhale(performance.now(), true);
  } else {
    document.body.classList.add("dsh-rain");
    startRain();
  }

  const power = $("#powerline");
  power.classList.add("on");
  later(() => power.remove(), 1400);

  const logEl = $("#log");
  later(() => logEl.classList.add("show"), 240);
  later(() => $("#status").classList.add("show"), 1100);

  const lines = [
    "> establish neural link .................. OK",
    "> decrypt core 0x5A3F ................... OK",
    "> inject kernel payload ................. OK",
    "> bypass firewall / 3 layers ............ OK",
    "> synchronize 47 nodes .................. OK"
  ];

  await until(T.logAt);
  for (const line of lines){
    if (cancelled) return;
    const el = document.createElement("div");
    el.className = "ln";
    logEl.appendChild(el);
    await typeLine(el, line, 55);
    await sleep(80);
  }
  if (cancelled) return;

  /* ===== 第一段高潮(雨中): 故障条 → 径向闪光 → ACCESS GRANTED 压满屏 ===== */
  setPhase("DECRYPTING IDENTITY");
  await sleep(T.afterLog);
  if (cancelled) return;

  glitchBurst(5);
  logEl.classList.add("out");
  if (!REDUCED) $("#flash").classList.add("on");
  later(() => $("#enter").classList.add("on"), 180);
  later(() => setPhase("ENTERING SYSTEM · 0101"), 520);
  later(() => glitchBurst(3), 1200);

  await waitOr(T.grantHold, () => hurryFlag);
  if (cancelled) return;

  /* ===== 硬切黑场 → 片尾标题卡 ===== */
  document.body.classList.add("dsh-cut", "dsh-whale-dim");
  document.body.classList.remove("dsh-rain");
  stopRain();

  await sleep(T.cutBlack);
  if (cancelled) return;

  $("#titleBox").classList.add("show");
  scramble($("#title"), "DEEPSEEK HARNESS", T.scramble);
  later(() => $("#sub").classList.add("show"), 700);
  later(() => $("#title").classList.add("glitch"), T.scramble + 600);

  if (hurryFlag) await sleep(T.cardHoldFast);
  else await waitOr(T.cardHold, () => hurryFlag);
  if (cancelled) return;

  /* ===== 收尾: 逐字飘散 / 模糊消失 ===== */
  scatterTitle($("#title"), $("#titleBox"));
  await sleep(hurryFlag ? T.scatterFast : T.scatter);
  if (cancelled) return;

  finish(true);
}

/* ===== 交接: 淡到片头底色 → 通知宿主收起遮罩 ===== */
function finish(played){
  if (finished) return;
  finished = true;
  cancelled = true;

  timeouts.forEach(id => clearTimeout(id));
  timeouts.clear();
  intervals.forEach(id => clearInterval(id));
  intervals.clear();

  raining = false;
  if (raf){ cancelAnimationFrame(raf); raf = 0; }

  document.body.classList.add("dsh-fade");
  setTimeout(() => post({ t: "done" }), played ? 420 : 240);
}

/* ===== dsh-desktop 宿主桥(与 550c-boot.html 同名同形) ===== */
window.dsh550c = {
  play(){ playMatrix(); },                 /* 档位已由资源决定, 这里忽略参数 */
  skip(){ finish(false); },
  /* 主页面已经就绪: 别让用户干等, 把剩下的停留压到最短(片尾卡与飘散照旧保留) */
  hurry(){ if (launched && !finished) hurryFlag = true; },
  note(text){
    if (!text) return;
    hostNote = text;
    renderStatus();
  }
};

/* 播放期间点击画面 / 按 Esc 跳过 */
document.addEventListener("click", () => { if (launched && !finished) finish(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") finish(false); });
window.addEventListener("resize", () => { if (!finished) resize(); });

renderStatus();

/* 文档就绪 → 报到; 直接用浏览器打开时(没有宿主)自动播一遍, 方便单独预览 */
requestAnimationFrame(() => {
  post({ t: "ready" });
  if (!host) playMatrix();
});
})();
</script>
