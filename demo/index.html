<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 启动动画 · 预览</title>
<style>
  :root{
    --bg:#080a09; --panel:#0d1110; --line:#1b2620;
    --fg:#dff5e6; --dim:#7d9a8a; --green:#00ff66; --green-dim:#0f6b3a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:grid;grid-template-columns:320px 1fr;
    background:var(--bg);color:var(--fg);
    font:14px/1.6 Consolas,"Cascadia Mono","MS Gothic","Microsoft YaHei UI",monospace;
    overflow:hidden;
  }
  /* ---------- 侧栏 ---------- */
  aside{
    display:flex;flex-direction:column;gap:14px;
    padding:22px 20px;border-right:1px solid var(--line);
    background:linear-gradient(180deg,#0b0f0d,#080a09 60%);
    overflow-y:auto;
  }
  h1{font-size:15px;letter-spacing:.24em;font-weight:600;color:#eafff2}
  h1 span{color:var(--green)}
  .sub{font-size:11.5px;color:var(--dim);letter-spacing:.04em;margin-top:-6px}
  .group-title{
    font-size:10.5px;letter-spacing:.22em;color:var(--green-dim);
    margin-top:4px;text-transform:uppercase;
  }
  nav{display:flex;flex-direction:column;gap:6px}
  .item{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    width:100%;padding:9px 11px;text-align:left;cursor:pointer;
    background:transparent;color:var(--fg);
    border:1px solid var(--line);border-radius:4px;
    font:inherit;transition:background .15s,border-color .15s,color .15s;
  }
  .item:hover{border-color:var(--green-dim);background:#0e1a13}
  .item.on{border-color:var(--green);background:#0e1a13;color:#eafff2;
           box-shadow:inset 2px 0 0 var(--green)}
  .item .t{font-size:13px}
  .item .d{font-size:10.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
  .item.on .d{color:#5fd897}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  select,input{
    background:#0b1310;color:var(--fg);border:1px solid var(--line);border-radius:4px;
    padding:5px 7px;font:inherit;font-size:12px;
  }
  select:focus,input:focus{outline:1px solid var(--green-dim)}
  #replay{
    margin-top:2px;padding:8px 12px;cursor:pointer;font:inherit;font-size:12.5px;
    color:#04120a;background:var(--green);border:0;border-radius:4px;
    letter-spacing:.1em;transition:filter .15s;
  }
  #replay:hover{filter:brightness(1.12)}
  .note{
    margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--dim);line-height:1.75;
  }
  .note b{color:#a9c9b8;font-weight:400}
  .note a{color:var(--green)}
  /* ---------- 舞台 ---------- */
  main{position:relative;background:#000;overflow:hidden}
  iframe{width:100%;height:100%;border:0;display:block}
  .badge{
    position:absolute;left:14px;top:12px;z-index:2;pointer-events:none;
    padding:4px 9px;border-radius:3px;
    font-size:11px;letter-spacing:.14em;color:#9fe8c0;
    background:rgba(5,12,8,.62);border:1px solid rgba(0,255,102,.22);
    opacity:0;transition:opacity .3s;
  }
  .badge.show{opacity:1}
  @media (max-width:820px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    nav{flex-direction:row;flex-wrap:wrap}
    .item{width:auto}
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>DSH <span>SPLASH</span></h1>
    <p class="sub">启动动画合集 · 点击即播</p>
  </div>

  <div class="group-title">片头</div>
  <nav id="list"></nav>

  <div class="group-title">播放选项</div>
  <div class="row">
    <label for="speed">数字雨倍速</label>
    <select id="speed">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="0.5">0.5×</option>
      <option value="0.25">0.25×</option>
    </select>
    <button id="replay">重播</button>
  </div>
  <div class="row">
    <a id="open" href="#" target="_blank" rel="noopener" style="color:#7d9a8a">在新窗口打开 ↗</a>
  </div>

  <p class="note">
    <b>550C</b> 与 <b>高达</b> 同属一份页面，用 <code>?mode=</code> 切档；<br>
    数字雨支持 <code>?speed=</code> 倍速（调试用）。<br>
    播放中点击画面或按 <b>Esc</b> 可跳过。
  </p>
</aside>

<main>
  <div class="badge" id="badge"></div>
  <iframe id="frame" allow="autoplay" title="splash preview"></iframe>
</main>

<script>
const ITEMS = [
  { id:"matrix",  name:"黑客帝国 · 数字雨", desc:"~13s", src:"../splashes/matrix/index.html", mode:null },
  { id:"simple",  name:"550C 简易",        desc:"~4s",  src:"../splashes/550c/index.html",   mode:"simple" },
  { id:"full",    name:"550C 完整",        desc:"~16s", src:"../splashes/550c/index.html",   mode:"full" },
  { id:"gundam",  name:"高达动画",          desc:"~18s", src:"../splashes/550c/index.html",   mode:"gundam" },
];

const list = document.getElementById("list");
const frame = document.getElementById("frame");
const speed = document.getElementById("speed");
const badge = document.getElementById("badge");
const open = document.getElementById("open");
let current = ITEMS[0];

function urlFor(item){
  const p = new URLSearchParams();
  if (item.mode) p.set("mode", item.mode);
  if (item.id === "matrix") p.set("speed", speed.value);
  p.set("t", Date.now());          /* 破缓存, 保证每次都从头播 */
  return item.src + "?" + p.toString();
}

function select(item){
  current = item;
  [...list.children].forEach(b => b.classList.toggle("on", b.dataset.id === item.id));
  speed.disabled = item.id !== "matrix";
  frame.src = urlFor(item);
  open.href = urlFor(item);
  badge.textContent = item.name;
  badge.classList.add("show");
  clearTimeout(select._t);
  select._t = setTimeout(() => badge.classList.remove("show"), 2200);
}

ITEMS.forEach(item => {
  const b = document.createElement("button");
  b.className = "item";
  b.dataset.id = item.id;
  b.innerHTML = '<span class="t"></span><span class="d"></span>';
  b.querySelector(".t").textContent = item.name;
  b.querySelector(".d").textContent = item.desc;
  b.addEventListener("click", () => select(item));
  list.appendChild(b);
});

document.getElementById("replay").addEventListener("click", () => select(current));
speed.addEventListener("change", () => { if (current.id === "matrix") select(current); });

select(ITEMS[0]);
</script>
</body>
</html>
